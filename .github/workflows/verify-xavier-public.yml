name: Vérifier le suivi public Xavier
on:
  push:
    branches: [main]
    paths:
      - 'projets/xavier-labigang/variante-seche-linge.html'
      - 'projets/xavier-labigang/documents/**'
      - 'projets/xavier-labigang/images/**'
      - '.github/workflows/verify-xavier-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Contrôler la page publique, les deux équipements et les cinq PDF
        shell: python
        env:
          CHECK_REVISION: ${{ github.sha }}
        run: |
          import hashlib, json, os, pathlib, time, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          base='https://abrenov35.github.io/hub360/projets/xavier-labigang/'
          url=base+'variante-seche-linge.html'
          marker='xavier-haier-capture-20261105'
          expected_page=pathlib.Path('projets/xavier-labigang/variante-seche-linge.html').read_bytes()
          def get(target):
              req=urllib.request.Request(target,headers={'User-Agent':'AB-RENOV-Xavier-Link-Check','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  return response.status,response.headers.get_content_type(),response.read()
          page=None
          for attempt in range(24):
              try:
                  status,mime,body=get(url+'?verification='+os.environ['CHECK_REVISION']+'-'+str(attempt))
                  candidate=body.decode('utf-8')
                  if status==200 and marker in candidate and hashlib.sha256(body).digest()==hashlib.sha256(expected_page).digest(): page=candidate;break
              except Exception as exc: print('Publication en cours :',str(exc))
              time.sleep(5)
          assert page is not None,'Nouvelle version publique non confirmée'
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__();self.pdfs=[];self.amounts=[];self.images=[];self.hrefs=[];self.ids=set();self.anchors=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:self.ids.add(a['id'])
                  if tag=='img':self.images.append(a)
                  if tag=='a':
                      href=a.get('href','');self.hrefs.append(href)
                      if href.endswith('.pdf'):self.pdfs.append(href)
                      if href.startswith('#'):self.anchors.append(href[1:])
                      if 'data-amount-cents' in a:self.amounts.append(int(a['data-amount-cents']))
          parsed=Page();parsed.feed(page)
          expected_pdfs={
              'documents/Copeint_14563_2026-11-05.pdf':'65a1da79f6eecbf53ddc63a548cedc71ce8ecb6f2bc424f84ec2cb2644307b8c',
              'documents/Copeint_12897_2026-09-02.pdf':'d0415937dda599027a6072797ab442791ade233d3c3b9c6f733bdc907bd51717',
              'documents/Copeint_13199_2026-10-07.pdf':'399e00359b34ee9969416a7d6830001a7488b09cde8c1c45d387e741857f04b1',
              'documents/Copeint_13423_2026-10-30.pdf':'ec8a60fa8d1aaaa41d579db9a4ba2350c3717c6fea826eed3e4cd96a8f6fe84c',
              'documents/POINTP_2036525760_Baignoire.pdf':'0d275b6a5025e0dce2e9e8a74f1e9ee31643397eaa70822cb5a909726f480eae'
          }
          assert len(parsed.pdfs)==5 and set(parsed.pdfs)==set(expected_pdfs)
          assert len(parsed.amounts)==5 and sum(parsed.amounts)==156766
          assert all(a in parsed.ids for a in parsed.anchors)
          expected_models={'HD90-D357U1FR','TI64IB10IZ'}
          assert len(parsed.images)==2 and {x.get('data-model') for x in parsed.images}==expected_models
          for value in ('HD90-D357U1FR','TI64IB10IZ','371,90','356,19','1 889,54','Morvan','À facturer sur le chantier'):
              assert value in page,'Contenu manquant : '+value
          for obsolete in ('TE7G9CBS','TR729EC4PB','EW6H913SO','Electrolux','766,05'):
              assert obsolete not in page,'Ancien choix encore présent : '+obsolete
          _,_,raw=get(base+'images/sources.json?revision='+os.environ['CHECK_REVISION'])
          sources={p['model']:p for p in json.loads(raw)['products']}
          results=[]
          for image in parsed.images:
              model=image['data-model'];relative=image['src']
              assert relative=='images/'+sources[model]['file']
              assert relative in parsed.hrefs,'Agrandissement absent : '+model
              assert model in image.get('alt',''),'Texte alternatif absent : '+model
              status,mime,binary=get(urljoin(base,relative))
              assert status==200 and mime.startswith('image/') and len(binary)>1500
              assert hashlib.sha256(binary).hexdigest()==sources[model]['sha256']
              results.append({'type':'photo','model':model,'status':status,'size_bytes':len(binary)})
              print('PHOTO_PUBLIQUE_OK',model,status,mime,len(binary))
          for relative in parsed.pdfs:
              status,mime,binary=get(urljoin(base,relative))
              assert status==200 and binary.startswith(b'%PDF-')
              assert hashlib.sha256(binary).hexdigest()==expected_pdfs[relative]
              results.append({'type':'pdf','file':relative,'status':status,'size_bytes':len(binary)})
              print('PDF_PUBLIC_OK',relative,status)
          report={'page_url':url,'status':200,'revision':marker,'photos':2,'pdfs':5,'purchase_total_preserved':True,'appliances_validated':True,'photo_enlargement_links':2,'checks':results}
          print('PUBLICATION_OK '+json.dumps(report,ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Suivi Xavier validé\n\nVersion achats Findis validés, hors baignoire, publiée (HTTP 200).\n\nLa photo et son lien d’agrandissement sont accessibles sans connexion et conformes aux fichiers enregistrés.\n\nLes 5 PDF originaux et les montants HT sont conservés et contrôlés.\n')
