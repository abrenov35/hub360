name: Importer les PDF Labigang
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-labigang-pdf.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Importer et verifier les quatre originaux
        shell: python
        run: |
          import hashlib
          import pathlib
          import urllib.request
          documents = [
            ('Copeint_12897_2026-09-02.pdf', 'd0415937dda599027a6072797ab442791ade233d3c3b9c6f733bdc907bd51717', 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7cf8-81f4-b44a-7831ea895f96/raw?se=2026-10-30T19%3A43%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=7d4e7c65-ee3a-5fd4-9993-04cdfa217734&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-30T08%3A21%3A15Z&ske=2026-10-31T08%3A21%3A15Z&sks=b&skv=2026-02-06&sig=l38LneZo9Pcc880ROR4AED7TfiuvlWWsVMTlWwP%2BHiA%3D'),
            ('Copeint_13199_2026-10-07.pdf', '399e00359b34ee9969416a7d6830001a7488b09cde8c1c45d387e741857f04b1', 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-81fc-81f4-bc7a-1b09c05d19e6/raw?se=2026-10-30T19%3A43%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=3e4400df-fef4-57af-b5ef-f0ee862a19ea&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-30T06%3A07%3A08Z&ske=2026-10-31T06%3A07%3A08Z&sks=b&skv=2026-02-06&sig=wsjYbWpsx85nimEgx1%2BJcjSu6zuDp8LNok/kEKdpm08%3D'),
            ('Copeint_13423_2026-10-30.pdf', 'ec8a60fa8d1aaaa41d579db9a4ba2350c3717c6fea826eed3e4cd96a8f6fe84c', 'https://sdmntprukwest.oaiusercontent.com/files/00000000-7b18-8243-8639-6325aef3b8ac/raw?se=2026-10-30T19%3A43%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=54b23c5d-aa55-547e-bfab-b0b22f2ec435&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-30T06%3A08%3A16Z&ske=2026-10-31T06%3A08%3A16Z&sks=b&skv=2026-02-06&sig=T9BVA/MkA6O9MKYdcX/BeY5E6uR3kCODtS/1MWCpWXk%3D'),
            ('POINTP_2036525760_Baignoire.pdf', '0d275b6a5025e0dce2e9e8a74f1e9ee31643397eaa70822cb5a909726f480eae', 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7580-81f4-98c4-9dbc6aa01e48/raw?se=2026-10-30T19%3A43%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=66b677c3-7401-5dcf-b567-d13f3f392eed&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-30T04%3A35%3A17Z&ske=2026-10-31T04%3A35%3A17Z&sks=b&skv=2026-02-06&sig=hCNBdym8zGEq6r2H39aCCF1yrb27miEi9u2villzvDc%3D')
          ]
          target = pathlib.Path('projets/xavier-labigang/documents')
          target.mkdir(parents=True, exist_ok=True)
          for name, checksum, url in documents:
              dest = target / name
              if dest.exists() and hashlib.sha256(dest.read_bytes()).hexdigest() == checksum:
                  print(name, 'deja verifie')
                  continue
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read()
              if not data.startswith(b'%PDF-') or hashlib.sha256(data).hexdigest() != checksum:
                  raise ValueError('PDF original non conforme: ' + name)
              dest.write_bytes(data)
              print(name, len(data), 'octets, SHA256 conforme')
      - name: Enregistrer les PDF dans le site
        run: |
          git config user.name 'AB RENOV 35'
          git config user.email 'abrenov35@users.noreply.github.com'
          git add projets/xavier-labigang/documents/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Labigang: quatre PDF originaux consultables sans connexion'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
