name: Importer les visuels Xavier
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-xavier-product-visuals.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les photos des références exactes
        shell: python
        run: |
          import concurrent.futures, hashlib, json, pathlib, re, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          target = pathlib.Path('projets/xavier-labigang/images')
          target.mkdir(parents=True, exist_ok=True)
          products = {
            'TE7G9CBS': ['https://www.extra.fr/p-seche-linge-te7g9cbs'],
            'TR729EC4PB': ['https://www.extra.fr/p-seche-linge-tr729ec4pb'],
            'TI64IB10IZ': ['https://www.extra.fr/p-table-induction-ti64ib10iz'],
            'EW6H913SO': ['https://www.extra.fr/p-seche-linge-ew6h913so', 'https://brico-travo.com/electro-menager/540662-electrolux-seche-linge-ew6h913so---electrolux-7333394162065.html']
          }
          def get(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (compatible; AB-Renov-product-images/1.0)', 'Accept': '*/*'})
              with urllib.request.urlopen(request, timeout=25) as response:
                  return response.read(), response.headers.get_content_type(), response.geturl()
          class ProductHTML(HTMLParser):
              def __init__(self):
                  super().__init__(); self.images=[]; self.og=[]; self.headings=[]; self.in_heading=False
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag in ('title','h1'): self.in_heading=True
                  if tag=='meta' and d.get('property',d.get('name','')).lower() in ('og:image','og:image:secure_url','twitter:image'):
                      self.og.append(d.get('content',''))
                  if tag=='img':
                      for key in ('data-zoom-image','data-large_image','data-src','src'):
                          if d.get(key): self.images.append(d[key])
              def handle_endtag(self,tag):
                  if tag in ('title','h1'): self.in_heading=False
              def handle_data(self, data):
                  if self.in_heading: self.headings.append(data)
          def load_model(pair):
              model,pages=pair
              errors=[]
              for page in pages:
                  try:
                      raw,mime,final_page=get(page)
                      text=raw.decode('utf-8',errors='replace')
                      doc=ProductHTML(); doc.feed(text)
                      if model.lower() not in ' '.join(doc.headings).lower():
                          raise ValueError('Référence absente du titre de la fiche')
                      matching=[x for x in doc.images if model.lower() in x.lower() and not any(s in x.lower() for s in ('label','energy','etiquette'))]
                      matching.sort(key=lambda x: (0 if 'product_full' in x else 1, 0 if '_1_' in x else 1, -len(x)))
                      candidates=list(dict.fromkeys(matching + doc.og))
                      for candidate in candidates:
                          if candidate.startswith('data:'): continue
                          try:
                              image_url=urljoin(final_page,candidate)
                              binary,image_mime,final_image=get(image_url)
                              if len(binary)<1500: raise ValueError('Image trop petite')
                              if binary.startswith(b'\xff\xd8\xff'): ext='jpg'
                              elif binary.startswith(b'\x89PNG\r\n\x1a\n'): ext='png'
                              elif binary.startswith(b'RIFF') and binary[8:12]==b'WEBP': ext='webp'
                              else: raise ValueError('Format image non reconnu')
                              path=target/(model.lower()+'.'+ext)
                              path.write_bytes(binary)
                              result={'model':model,'file':path.name,'source_page':final_page,'source_image':final_image,'mime_type':image_mime,'size_bytes':len(binary),'sha256':hashlib.sha256(binary).hexdigest()}
                              print('PHOTO_OK '+json.dumps(result,ensure_ascii=False),flush=True)
                              return result
                          except Exception as exc:
                              errors.append(str(exc))
                  except Exception as exc:
                      errors.append(page+': '+str(exc))
              raise RuntimeError(model+' : '+' | '.join(errors))
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              results=list(executor.map(load_model,products.items()))
          assert len(results)==4
          (target/'sources.json').write_text(json.dumps({'retrieved_on':'2026-10-30','products':results},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Enregistrer les quatre visuels
        run: |
          git config user.name 'AB RENOV 35'
          git config user.email 'abrenov35@users.noreply.github.com'
          git add projets/xavier-labigang/images/
          if ! git diff --cached --quiet; then
            git commit -m 'Xavier : quatre photos de produits identifiées et leurs sources'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Préparer le contrôle visuel
        uses: actions/upload-artifact@v4
        with:
          name: xavier-product-visuals
          path: projets/xavier-labigang/images/
          retention-days: 2
